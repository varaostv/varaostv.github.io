<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaraoStv - IPTV Premium</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Adicionando fontes do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Cabeçalho com navegação -->
    <header>
        <nav>
            <ul>
                <li><a href="#home">Início</a></li>
                <li><a href="#filmes">Filmes</a></li>
                <li><a href="#series">Séries</a></li>
                <li><a href="#ofertas">Ofertas</a></li>
                <li><a href="#contato">Contato</a></li>
            </ul>
        </nav>
    </header>

    <!-- Carrossel de imagens -->
    <section id="home" class="carousel">
        <div class="carousel-item">
            <img src="imagem1.jpg" alt="Imagem 1">
        </div>
        <div class="carousel-item">
            <img src="imagem2.jpg" alt="Imagem 2">
        </div>
        <div class="carousel-item">
            <img src="imagem3.jpg" alt="Imagem 3">
        </div>
    </section>

    <!-- Seção de Ofertas -->
    <section id="ofertas">
        <h2>Ofertas Especiais</h2>
        <p>Teste nosso serviço agora e aproveite descontos exclusivos!</p>
        <button class="cta-button">Teste agora</button>
    </section>

    <!-- Rodapé -->
    <footer>
        <p>&copy; 2025 VaraoStv - Todos os direitos reservados.</p>
    </footer>
</body>
</html>
